name: Clinic Management CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-ci:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_phongkham_thaithinh
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, bcmath, curl, fileinfo
        coverage: none

    - name: Configure Environment
      run: |
        cp .env.example .env
        sed -i 's/DB_DATABASE=laravel/DB_DATABASE=test_phongkham_thaithinh/' .env
        sed -i 's/DB_PASSWORD=/DB_PASSWORD=root/' .env

    - name: Install Composer Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Generate Application Key
      run: php artisan key:generate --ansi

    - name: Set Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: PHP Syntax Linting
      run: find app config database routes -type f -name "*.php" -exec php -l {} +

    - name: Run Laravel Pint (Code Style Verification)
      run: vendor/bin/pint --test

    - name: Execute Database Migrations (MySQL)
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: test_phongkham_thaithinh
        DB_USERNAME: root
        DB_PASSWORD: root
      run: php artisan migrate --force

    - name: Execute Automated Test Suite (PHPUnit)
      env:
        APP_ENV: testing
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
        SESSION_DRIVER: array
        CACHE_DRIVER: array
      run: vendor/bin/phpunit --colors=always
